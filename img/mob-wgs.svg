<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 170" role="img" aria-label="World's greatest stretch: affondo con mani a terra, poi rotazione con un braccio verso il soffitto">
  <rect width="340" height="170" rx="18" fill="#15181D"/>
  <g stroke="#2A2E36" stroke-width="2"><line x1="12" y1="150" x2="158" y2="150"/><line x1="182" y1="150" x2="328" y2="150"/></g>
  <!-- Partenza: affondo profondo, tibia avanti verticale, mani a terra -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="68,92 52,120 44,148" stroke="#6B717B" stroke-width="6"/>
    <g stroke="#C9CDD3" stroke-width="7">
      <polyline points="98,118 62,112 60,148"/>
      <polyline points="98,118 126,134 152,146"/>
      <line x1="98" y1="118" x2="68" y2="90"/>
      <polyline points="68,92 58,120 52,148"/>
    </g>
  </g>
  <circle cx="58" cy="80" r="10" fill="#C9CDD3"/>
  <!-- Freccia -->
  <g fill="none" stroke="#C6F432" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="154" y1="64" x2="184" y2="64"/><polyline points="176,56 184,64 176,72"/>
  </g>
  <!-- Arrivo: un braccio ruota verso il soffitto -->
  <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#C9CDD3">
      <polyline points="270,118 234,112 232,148"/>
      <polyline points="270,118 298,134 324,146"/>
      <line x1="270" y1="118" x2="240" y2="90"/>
      <polyline points="240,92 230,120 224,148"/>
    </g>
    <polyline points="240,90 244,58 248,26" stroke="#C6F432"/>
  </g>
  <circle cx="228" cy="82" r="10" fill="#C9CDD3"/>
  <path d="M268 54 A 24 24 0 0 0 258 24" fill="none" stroke="#C6F432" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round"/>
  <text x="85" y="166" fill="#9AA0A8" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">1 · affondo, mani a terra</text>
  <text x="255" y="166" fill="#9AA0A8" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">2 · ruota, braccio in alto</text>
</svg>
